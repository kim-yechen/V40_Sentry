name: V40 Hybrid Sentry (Pure Telegram Only)

on:
  schedule:
    # UTC 22:30 (KST 07:30) | 일~금 실행 -> 한국 시간 월~토 아침 보고
    - cron: '30 22 * * 0-5'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install yfinance pandas requests openpyxl
      - name: Run Sentry Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python sentry.py
