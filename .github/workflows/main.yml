name: V40 Hybrid Sentry (Daily Msg + Weekly File)

on:
  schedule:
    # 한국시간 화~토 오전 07:30 (UTC 월~금 22:30)
    # 미국 월~금 장 마감 직후에 실행됩니다.
    - cron: '30 22 * * 1-5'

  workflow_dispatch: # 필요할 때 수동 실행 가능
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests openpyxl
      - name: Run Sentry Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python sentry.py
