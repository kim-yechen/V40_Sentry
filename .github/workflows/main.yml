name: V40 Hybrid Sentry (Daily Msg + Weekly File)

on:
  schedule:
    # 0(일)요일부터 5(목)요일까지 UTC 22:30에 실행
    # -> 한국시간(KST) 기준 월, 화, 수, 목, 금, 토 오전 07:30 실행
    - cron: '30 22 * * 0-5'

  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests openpyxl
      - name: Run Sentry Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python sentry.py
